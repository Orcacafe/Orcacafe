<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ORCA POS</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="pos.css">

</head>

<body>

    <!-- =================================================
         ORCA POS LOCK SCREEN
    ================================================== -->

    <div
        id="lockScreen"
        class="lock-screen">

        <div class="lock-card">

            <img
                src="assets/logo.png"
                class="lock-logo"
                alt="ORCA">

            <h1>
                ORCA POS
            </h1>

            <p>
                ورود صندوق‌دار
            </p>

            <input
                id="pinInput"
                type="password"
                inputmode="numeric"
                maxlength="4"
                placeholder="••••"
                class="pin-input"
                autocomplete="off">

            <button
                id="unlockBtn"
                class="unlock-btn">

                ورود

            </button>

            <div class="remember-note">

                این دستگاه به مدت ۳۰ روز
                به خاطر سپرده می‌شود

            </div>

        </div>

    </div>


    <!-- =================================================
         ORCA POS APPLICATION
    ================================================== -->

    <div
        id="posApp"
        class="container">

        <div class="background"></div>

        <header class="hero">

            <img
                src="assets/logo.png"
                class="logo"
                alt="ORCA">

        </header>

        <h2 class="pos-title">
            ثبت سفارش
        </h2>


        <!-- =================================================
             قفل دستی صندوق
        ================================================== -->

        <button
            id="lockBtn"
            class="lock-pos-btn">

            🔒 قفل صندوق

        </button>


        <nav
            id="categoryTabs"
            class="tabs">
        </nav>

        <section
            id="menuContainer">
        </section>

        <section
            id="orderPanel">
        </section>

    </div>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="menu.js"></script>

    <script src="pos.js"></script>

</body>

</html>
